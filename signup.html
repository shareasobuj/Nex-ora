<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Nexora</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-body">


<div class="auth-wrapper">

    <div class="auth-brand">

        <a href="index.html" class="logo">
            Nex<span>ora</span>
        </a>

        <p>
            Build. Grow. Lead.
        </p>

    </div>


    <div class="auth-card signup-card">

        <div class="auth-header">

            <div class="auth-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h1>Create Account</h1>

            <p>
                Join Nexora and start building your future.
            </p>

        </div>


        <form id="signupForm">


            <div class="form-group">

                <label for="signupName">
                    Full Name
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="John Doe"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label for="signupEmail">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="you@example.com"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label for="signupPassword">
                    Password
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Minimum 6 characters"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="signupPassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>


            <div class="password-strength">

                <div class="strength-bar">
                    <span id="strengthBar"></span>
                </div>

                <small id="strengthText">
                    Password strength
                </small>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-shield"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repeat your password"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirmPassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>


            <label class="terms-check">

                <input
                    type="checkbox"
                    id="terms"
                    required>

                <span>
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </span>

            </label>


            <button type="submit" class="auth-btn">

                Create Account

                <i class="fa-solid fa-user-plus"></i>

            </button>


            <p class="auth-message" id="signupMessage"></p>

        </form>


        <div class="divider">
            <span>OR</span>
        </div>


        <button class="social-auth" id="googleSignupDemo">

            <i class="fa-brands fa-google"></i>

            Sign up with Google

        </button>


        <p class="auth-bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a href="index.html" class="back-home">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Website

        </a>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
